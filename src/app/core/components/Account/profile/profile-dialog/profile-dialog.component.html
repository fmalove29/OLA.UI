<h2 mat-dialog-title>Add Permission</h2>

<mat-dialog-content>
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="row">

        <div class="col-12 mt-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Role</mat-label>
                <mat-select formControlName="Role">
                    @for (ur of userRoles; track ur) {
                    <mat-option [value]="ur">{{ ur }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>

        <div class="col-12 mt-3">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Module</mat-label>
                <mat-select formControlName="Modules">
                    @for (mod of modules; track mod) {
                    <mat-option [value]="mod">{{ mod }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>

        <div class="col-12 mt-3">
            <div class="row">
                <div class="col-12 d-flex justify-content-end">
                    <button mat-button mat-dialog-close>Close</button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid">
                        Submit
                    </button>
                </div>
            </div>
        </div>

    </form>

</mat-dialog-content>
