<div class="logo">
    <img src="assets/images/undraw_businessman_8vs7.png" alt="" class="w-100" />
</div>

<mat-accordion multi>
    <mat-expansion-panel *ngFor="let module of objectKeys(groupedAccess)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                {{ module }}
            </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-nav-list>
            <a mat-list-item *ngFor="let path of groupedAccess[module]" [routerLink]="path">
                <span matLine>{{ formatPathName(path) }}</span>
            </a>
        </mat-nav-list>
    </mat-expansion-panel>
</mat-accordion>
