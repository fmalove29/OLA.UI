<!-- menu.component.html -->
<div class="logo">
    <img src="assets/images/undraw_businessman_8vs7.png" alt="" class="w-100">
</div>

<mat-accordion multi>
    <mat-expansion-panel *ngFor="let menu of accessMenus">
        <mat-expansion-panel-header>
            <mat-panel-title>
                <mat-icon *ngIf="menu.icon">{{ menu.icon }}</mat-icon>
                {{ menu.name }}
            </mat-panel-title>
        </mat-expansion-panel-header>

        <!-- Children menu items -->
        <mat-nav-list>
            <a mat-list-item *ngFor="let child of menu.children" [routerLink]="child.link">
                <mat-icon *ngIf="child.icon" matListIcon>{{ child.icon }}</mat-icon>
                <span matLine>{{ child.name }}</span>
            </a>
        </mat-nav-list>
    </mat-expansion-panel>
</mat-accordion>
