<div mat-dialog-content>
    <p>{{ data.message }}</p>
</div>

<div mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ data.cancelText }}</button>
    <button mat-button color="primary" [mat-dialog-close]="true">{{ data.confirmText }}</button>
</div>
